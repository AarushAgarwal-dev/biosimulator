name: tests

# Why this exists. Until now nothing ran the test suite except a person remembering to.
# That is how deploy/cc3d/buildspec.yml stayed broken for hours -- the worker image could
# not be rebuilt at all, and every local test was green because none of them read a
# deployment manifest. A suite that only runs when someone chooses to run it is not a
# safety net for the times it matters most: a hurried change, or a contributor who does not
# know the local setup.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push supersedes an in-flight run on the same ref, so the queue reflects HEAD.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the development interpreter (3.13.7). The suite is pure Python plus
          # prebuilt wheels, so no compiler is needed.
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pyyaml is used only by the deployment-manifest tests; without it they skip
          # rather than fail, and skipping is exactly what let the buildspec break go
          # unnoticed, so it is installed deliberately.
          pip install pyyaml

      - name: Run the test suite
        # NO AWS CREDENTIALS AND NO BIOSIM_* CONFIGURATION ARE SET, deliberately. The suite
        # is expected to pass on a bare runner: CompuCell3D reports itself unavailable, the
        # remote backend is unconfigured, and the live Bedrock test skips unless
        # BIOSIM_LIVE_BEDROCK is set. Verified locally with all of those stripped: 901
        # tests, 1 skipped. If a test starts needing credentials to pass, that is a defect
        # in the test, not a reason to add secrets here.
        run: python -m unittest discover -p "test_*.py" -v
